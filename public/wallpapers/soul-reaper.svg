<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1600" width="2560" height="1600">
  <defs>
    <radialGradient id="reaper-sky" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#140A04"/>
      <stop offset="45%" stop-color="#090503"/>
      <stop offset="85%" stop-color="#030202"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="moon-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6D00" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#FF3D00" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#DD2C00" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="reiatsu-beam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF9100" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#FF3D00" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF1744" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blade-cut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#212121"/>
    </linearGradient>
  </defs>

  <!-- Deep Void Background -->
  <rect width="2560" height="1600" fill="url(#reaper-sky)"/>

  <!-- Colossal Crimson Blood Moon & Aura -->
  <circle cx="1650" cy="550" r="420" fill="url(#moon-aura)"/>
  <!-- Moon Body -->
  <circle cx="1650" cy="550" r="220" fill="#FFF3E0"/>
  <!-- Crescent Shadow -->
  <circle cx="1740" cy="510" r="215" fill="#0C0604"/>

  <!-- Spiritual Pressure Pillars Rising from Below (Seireitei / Hueco Mundo) -->
  <path d="M 600 1600 L 750 200 L 820 1600 Z" fill="url(#reiatsu-beam)" opacity="0.45"/>
  <path d="M 1200 1600 L 1280 100 L 1360 1600 Z" fill="url(#reiatsu-beam)" opacity="0.6"/>
  <path d="M 1750 1600 L 1820 300 L 1900 1600 Z" fill="url(#reiatsu-beam)" opacity="0.4"/>

  <!-- Huge Dynamic Getsuga Tensho Energy Crescent Arc Across Canvas -->
  <path d="M 150 1450 C 700 1000, 1600 650, 2400 350" fill="none" stroke="#FF5722" stroke-width="18" stroke-linecap="round" opacity="0.85" filter="drop-shadow(0 0 35px #FF6D00)"/>
  <path d="M 220 1420 C 740 980, 1620 640, 2380 370" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
  <path d="M 100 1480 C 650 1020, 1550 680, 2420 330" fill="none" stroke="#DD2C00" stroke-width="32" stroke-linecap="round" opacity="0.35"/>

  <!-- Traditional Pagoda & Torii Gate Silhouettes on Ridge -->
  <polygon points="0,1600 0,1350 450,1380 850,1440 1450,1400 1950,1460 2560,1380 2560,1600" fill="#060302"/>
  
  <!-- Torii Gate Silhouette on Cliff -->
  <g transform="translate(680, 1260)" fill="#030202">
    <!-- Posts -->
    <rect x="0" y="0" width="16" height="130"/>
    <rect x="140" y="0" width="16" height="130"/>
    <!-- Kasagi Top Curved Beam -->
    <path d="M -30 15 Q 78 -5 186 15 L 186 32 Q 78 12 -30 32 Z"/>
    <!-- Nuki Lower Beam -->
    <rect x="-10" y="45" width="176" height="14"/>
    <!-- Gakuzuka Central Strut -->
    <rect x="74" y="24" width="8" height="24"/>
  </g>

  <!-- Lone Substitute Soul Reaper Silhouette with Cloak & Blade -->
  <g transform="translate(755, 1220)" fill="#000000">
    <ellipse cx="15" cy="8" rx="8" ry="11"/>
    <!-- Haori / Shihakusho Fluttering Body -->
    <path d="M 5 20 L 25 20 L 35 75 L -10 75 Z"/>
    <path d="M -5 30 L -35 55 L -15 65 Z" opacity="0.95"/>
    <!-- Long Katana over Shoulder -->
    <line x1="-12" y1="85" x2="48" y2="-20" stroke="#000000" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="48" y1="-20" x2="68" y2="-65" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
    <!-- Flowing Cloth Ribbon -->
    <path d="M 48 -20 Q 20 -40 10 -70" fill="none" stroke="#FF3D00" stroke-width="2.5" opacity="0.75"/>
  </g>

  <!-- Floating Spirit Butterflies & Fireflies -->
  <g fill="#FF9E80" opacity="0.7">
    <circle cx="950" cy="1150" r="3.5"/>
    <circle cx="1020" cy="1080" r="2.5"/>
    <circle cx="890" cy="1220" r="4"/>
    <circle cx="1150" cy="1200" r="2"/>
    <circle cx="1400" cy="1100" r="3"/>
    <circle cx="1520" cy="980" r="3.5"/>
    <circle cx="620" cy="1120" r="2.5"/>
  </g>

  <!-- Japanese Kanji Typography Subtle Watermark: 天鎖斬月 (Tensa Zangetsu) -->
  <text x="180" y="320" font-family="'SF Pro Display', serif, sans-serif" font-size="96" font-weight="900" fill="#FF5722" opacity="0.18" letter-spacing="12">天鎖斬月</text>
  <text x="185" y="380" font-family="'SF Pro Display', sans-serif" font-size="28" font-weight="600" fill="#FFAB91" opacity="0.25" letter-spacing="8">BANKAI // TENSA ZANGETSU</text>

  <!-- Screen Vignette -->
  <rect width="2560" height="1600" fill="none" stroke="#000000" stroke-width="90" opacity="0.5"/>
</svg>

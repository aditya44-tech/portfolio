<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="22" fill="#00192E"/>
  <g transform="translate(50,50)">
    <!-- Crunchyroll orange circle with bite -->
    <circle cx="0" cy="0" r="33" fill="#F47521"/>
    <!-- Inner white dot of the "roll" -->
    <circle cx="0" cy="0" r="20" fill="#00192E"/>
    <!-- The "bite" cutout -->

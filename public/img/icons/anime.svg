<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="anime-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0E"/>
      <stop offset="50%" stop-color="#1E120A"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>
    <linearGradient id="blade-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#B0BEC5"/>
      <stop offset="100%" stop-color="#37474F"/>
    </linearGradient>
    <linearGradient id="reiatsu-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>
    <linearGradient id="glass-glare" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="url(#anime-bg)" filter="url(#shadow)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="url(#glass-glare)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Manga Book / Katana Slash & Spiritual Flame -->
  <g transform="translate(0, 0)">
    <!-- Book Back Pages -->
    <path d="M 28 42 C 40 38, 56 42, 64 46 C 72 42, 88 38, 100 42 L 100 86 C 88 82, 72 86, 64 90 C 56 86, 40 82, 28 86 Z" fill="#F8F9FA" opacity="0.95" stroke="#CFD8DC" stroke-width="1.5"/>

    <!-- Left Page Texture Lines -->
    <line x1="36" y1="52" x2="56" y2="54" stroke="#90A4AE" stroke-width="2" stroke-linecap="round"/>
    <line x1="36" y1="60" x2="54" y2="62" stroke="#90A4AE" stroke-width="2" stroke-linecap="round"/>
    <line x1="36" y1="68" x2="56" y2="70" stroke="#90A4AE" stroke-width="2" stroke-linecap="round"/>
    <line x1="36" y1="76" x2="50" y2="78" stroke="#90A4AE" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Page Manga Panel -->
    <rect x="70" y="50" width="22" height="26" rx="2" fill="#ECEFF1" stroke="#37474F" stroke-width="1.5"/>

    <!-- Sharp Diagonal Katana Slash across book -->
    <path d="M 22 96 L 98 28 L 104 32 L 28 100 Z" fill="url(#blade-gradient)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.4))"/>
    
    <!-- Spiritual Pressure Crescent Slash (Getsuga Tensho) -->
    <path d="M 40 88 Q 70 65 92 36" fill="none" stroke="url(#reiatsu-glow)" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
